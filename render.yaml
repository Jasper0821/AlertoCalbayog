services:
  - type: web
    name: alertocalbayog-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASS
        sync: false
      # Image hosting for incident evidence photos. Without these the app falls
      # back to storing base64 inline, which MongoDB caps at 16MB per report.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Google Sign-In. Same value as EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID in
      # mobile/eas.json — the server checks incoming ID tokens were issued for
      # this client. Google Sign-In is refused while it is unset.
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
